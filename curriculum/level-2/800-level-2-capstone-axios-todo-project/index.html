<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Axios Capstone</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="header-content">
                <h1 class="main-title">Level 2 Capstone</h1>
                <h1 class="subtitle">Axios ToDo List</h1>
                <h1 class="name">Will Elliott</h1>
            </div>
        </header>
        <h1 id="vschool-quote">"Organize, Prioritize, Conquer"</h1>
        <div class="forms-container">
            <form id="toDoForm">
                <h1>Add Items To List!</h1>
                <input id="toDoTitle" placeholder="title">
                <input id="toDoPrice" placeholder="price">
                <input id="toDoDescription" placeholder="description">
                <input id="toDoImg" placeholder="img url">
                <button id="submit-btn">Submit</button>
            </form>
            <form id="toDoList">

            </form>
        </div>
        <footer>
            <div class="footer-images">
                <img src="https://avatars.githubusercontent.com/u/50278?s=280&v=4" alt="XImg">
                <img src="https://cdn.icon-icons.com/icons2/3398/PNG/512/circle_facebook_logo_icon_214753.png" alt="Facebook">
                <img src="https://as2.ftcdn.net/v2/jpg/02/50/30/59/1000_F_250305943_sDC6la1N1fDl3bLgfLxOkQwItIodsdMb.jpg" alt="GitHubImg">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Instagram_logo.png/1024px-Instagram_logo.png" alt="Instagram">
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
